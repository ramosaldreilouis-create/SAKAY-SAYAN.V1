<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BusVerify PH | Bus Legal Documents Verification System</title>
  <meta name="description" content="Bus operators submit legal documents, the Super Admin verifies them and issues a QR code, and LTO officers scan it to confirm a bus is road-legal.">
  <meta name="theme-color" content="#0a3db0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a2e6e'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V9z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">

  <!-- Scripts are deferred so a slow or blocked CDN never delays the first paint. Deferred
       scripts run in order, and app.js only touches the QR libraries when a button is clicked. -->
  <!-- QR code generation (operator "View QR") -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- QR code scanning with the camera (LTO officer "Scan with camera"); version pinned -->
  <script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="gov-bar"><div class="container">Republic of the Philippines &middot; Department of Transportation &middot; Land Transportation Office</div></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="BusVerify PH home">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#fff"/><path d="M16 6l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V9z" fill="#0a2e6e"/></svg>
        <span>BusVerify <b>PH</b></span>
      </a>
      <button class="icon-btn menu-toggle" data-action="toggle-menu" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle menu">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <div id="auth-area" class="auth-area"></div>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> BusVerify PH. Demo build: data is stored only in this browser.</p>
    </div>
  </footer>

  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-inner">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" data-action="close-modal" aria-label="Close dialog">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </dialog>

  <div id="toast" class="toast-region" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">This application needs JavaScript to run.</p></noscript>
  <script defer src="app.js"></script>
</body>
</html>
